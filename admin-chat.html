<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Messagerie privée administrateur MY Investissements">
  <title>Mesaj prive — MY Investissements</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#13213d}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e4e9f2}.top-left{display:flex;align-items:center;gap:10px}.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:14px;background:#edf2fa;color:#13213d;text-decoration:none;font-size:24px}.top strong{font-size:18px}.lang{min-width:74px;padding:11px;border:1px solid #d7deea;border-radius:14px;background:#fff;font-weight:700}.wrap{max-width:760px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:18px;box-shadow:0 12px 36px rgba(15,23,42,.06)}h1{font-size:28px;margin:0 0 6px}.muted{margin:0 0 18px;color:#69758a;line-height:1.5}.row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}.label{font-weight:700;margin-bottom:7px;display:block}.select,.textarea{width:100%;border:1px solid #d8dfeb;border-radius:15px;background:#fff;padding:13px 14px;font-size:16px;color:#13213d}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.status{display:inline-flex;padding:8px 12px;border-radius:999px;font-weight:700;background:#fff3cd;color:#7a5a00}.status.open{background:#dcfce7;color:#166534}.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.openBtn{background:#dcfce7;color:#166534}.closeBtn{background:#fee2e2;color:#991b1b}.sendBtn{background:#14213d;color:#fff;width:100%}.chat{height:48vh;min-height:280px;overflow:auto;background:#f7f9fc;border:1px solid #e4e9f2;border-radius:18px;padding:12px;margin:16px 0;display:flex;flex-direction:column;gap:10px}.empty{margin:auto;color:#7a8496;text-align:center}.bubble{max-width:86%;padding:11px 13px;border-radius:16px;line-height:1.4;word-break:break-word}.bubble.service{align-self:flex-end;background:#14213d;color:#fff;border-bottom-right-radius:5px}.bubble.investor{align-self:flex-start;background:#fff;border:1px solid #dde4ef;border-bottom-left-radius:5px}.bubble small{display:block;margin-top:5px;opacity:.7;font-size:11px}.compose{display:grid;gap:10px}.textarea{min-height:90px;resize:vertical}.notice{font-size:13px;color:#64748b;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:11px 16px;border-radius:999px;transition:.2s;z-index:20;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:600px){.row{grid-template-columns:1fr auto;align-items:end}.sendBtn{width:auto;min-width:140px;justify-self:end}.compose{grid-template-columns:1fr auto;align-items:end}.textarea{min-height:80px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-left"><a class="back" href="admin.html" aria-label="Retounen">←</a><strong id="pageTitle">Mesaj prive</strong></div>
    <select id="langSelect" class="lang"><option value="ht">HT</option><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option></select>
  </header>
  <main class="wrap">
    <section class="card">
      <h1 id="heading">Mesaj prive</h1>
      <p id="intro" class="muted">Admin lan chwazi envestisè li vle pale avè l. Envestisè a sèlman wè “Sèvis MY”, li pa wè idantite admin lan.</p>
      <div class="row">
        <label><span id="investorLabel" class="label">Chwazi envestisè</span><select id="chatUserSelect" class="select"><option value="">Chajman...</option></select></label>
        <div class="controls"><span id="conversationStatus" class="status">Fèmen</span><button id="openConversationBtn" type="button" class="btn openBtn">Louvri mesajri</button><button id="closeConversationBtn" type="button" class="btn closeBtn">Fèmen</button></div>
      </div>
      <div id="messageList" class="chat"><div class="empty" id="emptyText">Chwazi yon envestisè.</div></div>
      <form id="messageForm" class="compose">
        <textarea id="messageText" class="textarea" maxlength="1000" placeholder="Ekri yon mesaj..." required></textarea>
        <button id="sendBtn" class="btn sendBtn" type="submit">Voye</button>
      </form>
      <p id="privacyText" class="notice">Envestisè yo pa resevwa non, imel, UID oswa lòt enfòmasyon pèsonèl admin lan.</p>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="admin-chat.js?v=20260912-2300"></script>
</body>
</html>
